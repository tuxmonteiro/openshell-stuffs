id: profile-external-qdrant
display_name: Qdrant Vector Search Engine
description: Access to the qdrant endpoint
category: data
inference_capable: false
credentials:
- name: qdrant_api_key
  description: qdrant API key
  env_vars:
  - QDRANT_API_KEY
  required: true
  auth_style: bearer
  header_name: authorization
  query_param: ''

endpoints:
- host: **.aws.cloud.qdrant.io
  ports: [443,6333]
  path: /**
  protocol: rest
  access: read-write
  enforcement: audit
  credentials:
  - qdrant_api_key

- host: **.aws.cloud.qdrant.io
  port: 6334
  protocol: tcp
  allow_uninspected_credentials: true

binaries:
- { path: "/**" }
