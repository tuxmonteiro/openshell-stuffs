id: profile-api-jina-ai
display_name: Jina AI (api.jina.ai)
description: Access to the Jina AI endpoint (api.jina.ai)
category: inference
inference_capable: true
credentials:
- name: jina_ai_api_key
  description: Jina AI API key
  env_vars:
  - JINA_AI_API_KEY
  required: false
  auth_style: bearer
  header_name: authorization
  query_param: ''
endpoints:
- host: api.jina.ai
  port: 443
  path: /**
  protocol: rest
  access: read-write
  enforcement: enforce
  credentials:
  - jina_ai_api_key
binaries:
- /usr/local/bin/omniroute
- /usr/local/bin/node
- /usr/bin/curl
- /home/*/.local/bin/claude
- /home/*/.local/bin/opencode
- /home/*/.opencode/bin/opencode
