id: profile-api-airforce
display_name: Api Airforce (api.airforce)
description: Access to the Api AirForce endpoint (api.airforce)
category: inference
inference_capable: true
credentials:
- name: airforce_api_key
  description: Api AirForce API key
  env_vars:
  - API_AIRFORCE_API_KEY
  required: false
  auth_style: bearer
  header_name: authorization
  query_param: ''
endpoints:
- host: api.airforce
  port: 443
  path: /**
  protocol: rest
  access: read-write
  enforcement: enforce
  credentials:
  - airforce_api_key
binaries:
- /usr/local/bin/omniroute
- /usr/local/bin/node
- /usr/bin/curl
- /home/*/.local/bin/claude
- /home/*/.local/bin/opencode
- /home/*/.opencode/bin/opencode
