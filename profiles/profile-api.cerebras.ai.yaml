id: profile-api-cerebras-ai
display_name: Cerebras (api.cerebras.ai)
description: Access to the Cerebras endpoint (api.cerebras.ai)
category: inference
inference_capable: true
credentials:
- name: cerebras_api_key
  description: Cerebras API key
  env_vars:
  - CEREBRAS_API_KEY
  required: false
  auth_style: bearer
  header_name: authorization
  query_param: ''
endpoints:
- host: api.cerebras.ai
  port: 443
  path: /**
  protocol: rest
  access: read-write
  enforcement: enforce
  credentials:
  - cerebras_api_key
binaries:
- /usr/local/bin/omniroute
- /usr/local/bin/node
- /usr/bin/curl
- /home/*/.local/bin/claude
- /home/*/.local/bin/opencode
- /home/*/.opencode/bin/opencode
