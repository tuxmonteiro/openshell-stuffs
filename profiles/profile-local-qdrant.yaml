id: profile-local-qdrant
display_name: Qdrant Vector Search Engine (host.docker.internal)
description: Access to the qdrant endpoint (host.docker.internal)
category: data
inference_capable: false
endpoints:
- host: host.docker.internal
  port: 6333
  path: /**
  protocol: rest
  access: read-write
  enforcement: audit
  allow_uninspected_credentials: true
- host: host.docker.internal
  port: 6334
  protocol: tcp
binaries:
- /usr/local/bin/omniroute
- /usr/local/bin/node
- /usr/bin/curl
