id: profile-api-novita-ai
display_name: Novita (api.novita.ai)
description: Access to the Novita endpoint (api.novita.ai)
category: inference
inference_capable: true
credentials:
- name: novita_api_key
  description: Novita API key
  env_vars:
  - NOVITA_API_KEY
  required: false
  auth_style: bearer
  header_name: authorization
  query_param: ''
endpoints:
- host: api.novita.ai
  port: 443
  path: /**
  protocol: rest
  access: read-write
  enforcement: enforce
  credentials:
  - novita_api_key
binaries:
- /usr/local/bin/omniroute
- /usr/local/bin/node
- /usr/bin/curl
