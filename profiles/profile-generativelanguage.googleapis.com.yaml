id: profile-generativelanguage-googleapis-com
display_name: Google Gemini (generativelanguage.googleapis.com)
description: Access to the Google Gemini endpoint (generativelanguage.googleapis.com)
category: inference
inference_capable: true
credentials:
- name: gemini_api_key
  description: Google Gemini API key
  env_vars:
  - GEMINI_API_KEY
  - GOOGLE_API_KEY
  required: false
  auth_style: bearer
  header_name: authorization
  query_param: ''
endpoints:
- host: generativelanguage.googleapis.com
  port: 443
  path: /**
  protocol: rest
  access: read-write
  enforcement: enforce
  credentials:
  - gemini_api_key
binaries:
- /usr/local/bin/omniroute
- /usr/local/bin/node
- /usr/bin/curl
- /home/*/.local/bin/claude
- /home/*/.local/bin/opencode
- /home/*/.opencode/bin/opencode
