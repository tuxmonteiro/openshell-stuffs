id: profile-api-mistral-ai
display_name: Mistral AI (api.mistral.ai)
description: Access to the Mistral AI endpoint (api.mistral.ai)
category: inference
inference_capable: true
credentials:
- name: mistral_api_key
  description: Mistral API key
  env_vars:
  - MISTRAL_API_KEY
  required: false
  auth_style: bearer
  header_name: authorization
  query_param: ''
endpoints:
- host: api.mistral.ai
  port: 443
  path: /**
  protocol: rest
  access: read-write
  enforcement: enforce
  credentials:
  - mistral_api_key
binaries:
- /usr/local/bin/omniroute
- /usr/local/bin/node
- /usr/bin/curl
- /home/*/.local/bin/claude
- /home/*/.local/bin/opencode
- /home/*/.opencode/bin/opencode
