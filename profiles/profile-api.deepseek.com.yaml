id: profile-api-deepseek-com
display_name: DeepSeek (api.deepseek.com)
description: Access to the DeepSeek endpoint (api.deepseek.com)
category: inference
inference_capable: true
credentials:
- name: deepseek_api_key
  description: DeepSeek API key
  env_vars:
  - DEEPSEEK_API_KEY
  required: false
  auth_style: bearer
  header_name: authorization
  query_param: ''
endpoints:
- host: api.deepseek.com
  port: 443
  path: /**
  protocol: rest
  access: read-write
  enforcement: enforce
  credentials:
  - deepseek_api_key
binaries:
- /usr/local/bin/omniroute
- /usr/local/bin/node
- /usr/bin/curl
- /home/*/.local/bin/claude
- /home/*/.local/bin/opencode
- /home/*/.opencode/bin/opencode
